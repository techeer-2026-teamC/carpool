global:
  scrape_interval: 10s
scrape_configs:
  - job_name: moa-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api1:9091, api2:9091]
        labels: {role: api}
  - job_name: moa-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [worker:9091]
        labels: {role: worker}
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
