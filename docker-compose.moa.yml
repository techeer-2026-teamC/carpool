name: moa-local

x-api: &api
  build: ./backend
  environment: &environment
    SPRING_PROFILES_ACTIVE: docker
    DB_URL: jdbc:postgresql://db:5432/moa
    DB_USERNAME: moa
    DB_PASSWORD: moa-local-only
    REDIS_HOST: redis
    JWT_SECRET: moa-local-development-only-secret-minimum-32-characters
    CORS_ALLOWED_ORIGINS: http://localhost:5173
    TZ: Asia/Seoul
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Duser.timezone=Asia/Seoul
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api1:
    <<: *api
    ports: ["127.0.0.1:18081:8080"]
  api2:
    <<: *api
    ports: ["127.0.0.1:18082:8080"]
  worker:
    <<: *api
    environment:
      <<: *environment
      APP_ROLE: worker
  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:18080:80"]
    volumes: ["./nginx/moa.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api1, api2]
  db:
    image: moa-postgis:15
    build:
      context: ./deploy/moa
      dockerfile: Dockerfile.postgis
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: moa-local-only
    ports: ["127.0.0.1:15432:5432"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on", "-c", "timezone=Asia/Seoul"]
    volumes:
      - moa_database:/var/lib/postgresql/data
      - ./deploy/moa/init.sql:/docker-entrypoint-initdb.d/01-observability.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["moa_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres-exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://moa:moa-local-only@db:5432/moa?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  redis-exporter:
    profiles: [monitoring]
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.51.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./prometheus-moa.yml:/etc/prometheus/prometheus.yml:ro
      - moa_prometheus:/prometheus
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: moa-local-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:13000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - moa_grafana:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  moa_database:
  moa_redis:
  moa_prometheus:
  moa_grafana:
