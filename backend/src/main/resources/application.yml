spring:
  profiles:
    active: local
  application:
    name: moa

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carpool}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15분
  refresh-token-expiration: 604800000  # 7일
  cookie-secure: true
  cookie-samesite: Strict              # 기본 same-origin 환경용. prod(cross-site)에서는 None 으로 override

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info,metrics"
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${app.role}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99
      slo:
        "[http.server.requests]": 100ms, 200ms, 500ms, 1s


app:
  role: ${APP_ROLE:api}
  legacy-ride:
    enabled: false
