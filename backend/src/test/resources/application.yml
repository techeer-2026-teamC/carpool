spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}

jwt:
  secret: test-secret-key-for-unit-testing-purposes-only!!
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  cookie-secure: false

cors:
  allowed-origins: http://localhost:5173

management:
  health:
    redis:
      enabled: false

app:
  role: api
  legacy-ride:
    enabled: true
