services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carpool-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/carpool
      DB_USERNAME: user
      DB_PASSWORD: password
      REDIS_HOST: redis
      JWT_SECRET: docker-load-test-secret-key-min32chars!!
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  db:
    image: postgres:15
    container_name: carpool-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: carpool
    volumes:
      - ./postgres_data:/var/lib/postgresql/data # DB가 꺼져도 데이터가 보존됩니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d carpool"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: carpool-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.51.0
    container_name: carpool-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:10.4.2
    container_name: carpool-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
