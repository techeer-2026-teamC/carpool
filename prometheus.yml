global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'carpool-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Docker Compose 환경: carpool-app 컨테이너 이름으로 접근
      # 로컬 직접 실행 시: host.docker.internal:8080 으로 변경
      - targets: ['carpool-app:8080']
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
